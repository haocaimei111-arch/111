<script>
/* ============================================================
   全局状态
============================================================ */
const state = {
  role: {
    id: 'ABCDEFGHIJKLM',
    name: '齐天大圣',
    author: '石头',
    fans: 1111000,
    co: 1111000,
    heat: 1111000,
    likes: 1300001000,
    liked: false,
    inLibrary: false,
    coCreateOpen: true,
    race: '猴子',
    birthday: '1月1日',
    brief: '上天入地无所无能，经历九九八十一难取得真经后养老花果山。',
    about: '很久很久以前有一个大石头，有一天大石头裂开了，从里面蹦出来一只小猴子。小猴子在花果山肆意地玩耍，他勇敢地穿越了水帘洞，凭借自己的能力和智慧，成为了花果山的猴王，后来自封为齐天大圣。',
  },
  coWorks: [
    { id: 1, title: '标题标题标题标题标题标题标题标题上限20字', author: '我', likes: 111, creator: true, h: 150 },
    { id: 2, title: '大圣归来 · 花果山之巅', author: '路人甲', likes: 88, creator: false, h: 200 },
    { id: 3, title: '筋斗云上的日落', author: '画师乙', likes: 233, creator: false, h: 130 },
    { id: 4, title: '金箍棒的故事', author: '路人丙', likes: 66, creator: false, h: 180 },
  ],
  myWorks: [
    { id: 11, title: '我与大圣的第一次相遇', author: '我', likes: 111, h: 160 },
    { id: 12, title: '深夜的花果山随笔', author: '我', likes: 42, h: 190 },
  ],
  navStack: [],
  currentScreen: 'screen-detail',
  isNewRole: false,
};

/* ============================================================
   工具：埋点 / 数值格式化 / Toast / 确认弹窗
============================================================ */
function track(ev, params) {
  console.log('[v0] 埋点:', ev, params || {});
}

function wan(n) {
  if (n < 10000) return String(n);
  let v = (n / 10000).toFixed(1);
  if (v.endsWith('.0')) v = v.slice(0, -2);
  return v + '万';
}

let toastTimer = null;
function toast(msg, tone) {
  const root = document.getElementById('overlay-root');
  const old = document.getElementById('toast-el');
  if (old) old.remove();
  const bg = tone === 'plain' ? 'bg-neutral-800 text-white' : 'bg-okgreen text-ink border border-okgreenbd';
  const el = document.createElement('div');
  el.id = 'toast-el';
  el.className = 'toast-anim pointer-events-none absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 max-w-[240px] px-4 py-3 rounded-pop text-sm text-center shadow ' + bg;
  el.textContent = msg;
  root.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2000);
}

function closeOverlay(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

/* 确认弹窗：tone = 'green' | 'warn' */
function confirmDialog({ title, desc, cancelText = '取消', okText = '确认', onOk, tone = 'green' }) {
  const root = document.getElementById('overlay-root');
  const box = tone === 'warn' ? 'bg-warnbg border border-warnbd' : 'bg-okgreen border border-okgreenbd';
  const okBtn = tone === 'warn' ? 'bg-white border border-warnbd text-ink' : 'bg-white border border-okgreenbd text-ink';
  const wrap = document.createElement('div');
  wrap.id = 'confirm-el';
  wrap.className = 'fade-in pointer-events-auto absolute inset-0 flex items-center justify-center bg-black/25 px-8';
  wrap.innerHTML = `
    <div class="${box} rounded-pop w-full max-w-[280px] px-5 py-5 text-center">

function showScreen(id, opts) {
  opts = opts || {};
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  el.classList.add('active', 'fade-in');
  if (!opts.noPush && state.currentScreen && state.currentScreen !== id) {
    state.navStack.push(state.currentScreen);
  }
  state.currentScreen = id;
  const scroller = el.querySelector('.overflow-y-auto');
  if (scroller) scroller.scrollTop = 0;
}

/* 背景下拉放大（下拉至原图一半上限，即 1.5x） */
(function initCoverZoom() {
  const cover = document.getElementById('rh-cover');
  let startY = 0, active = false;
  cover.addEventListener('touchstart', e => { startY = e.touches[0].clientY; active = true; }, { passive: true });
  cover.addEventListener('touchmove', e => {
    if (!active) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0) {
      const scale = Math.min(1.5, 1 + dy / 400);
      cover.style.transform = `scale(${scale})`;
    }
  }, { passive: true });
  cover.addEventListener('touchend', () => { active = false; cover.style.transform = 'scale(1)'; });
})();

/* ============================================================
   长按识别
============================================================ */
function bindLongPress(el, cb) {
  let timer = null;
  const start = () => { timer = setTimeout(() => { track('long_press', {}); cb(); }, 500); };
  const cancel = () => clearTimeout(timer);
  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchmove', cancel, { passive: true });
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
